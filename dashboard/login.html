<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResQNet Login</title><link rel="stylesheet" href="/css/resqnet.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#030508}.card{width:360px;background:#0b111e;border:1px solid #334155;border-radius:14px;padding:28px}.card h1{letter-spacing:.12em}.card input,.card button{width:100%;box-sizing:border-box;padding:12px;margin-top:12px;border-radius:7px}.card input{background:#070b14;border:1px solid #334155;color:#fff}.card button{border:0;background:#38bdf8;font-weight:800}.err{color:#f87171;font-size:12px}</style></head><body><form class="card" id="login"><h1>RES<b>Q</b>NET</h1><p>Secure emergency operations sign-in</p><input name="username" placeholder="Username" required autofocus><input name="password" type="password" placeholder="Password" required><button>LOGIN</button><p id="err" class="err"></p><small>Demo accounts: operator, ambulance1, hospital1. Password is configured on the server.</small></form><script>login.onsubmit=async e=>{e.preventDefault();let f=new FormData(login),r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}),d=await r.json();if(!r.ok)return err.textContent=d.error;localStorage.resqnetToken=d.token;localStorage.resqnetUser=JSON.stringify(d.user);location.href=d.user.role==='AMBULANCE'?'/ambulance.html':d.user.role==='HOSPITAL'?'/hospital.html':'/dashboard.html'}</script></body></html>
