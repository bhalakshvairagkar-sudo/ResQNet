<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResQNet Hospital</title><link rel="stylesheet" href="/css/resqnet.css"><script src="/socket.io/socket.io.js"></script><style>body{background:#030508;color:#eaf0f7;font-family:Arial;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.card{background:#0b111e;border:1px solid #334155;border-radius:12px;padding:22px;margin-top:18px}.alert{border:2px solid #ef4444;box-shadow:0 0 26px #ef444466}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid div{background:#070b14;padding:12px;border-radius:6px}.ack{background:#22c55e;padding:12px;border:0;border-radius:6px;font-weight:bold}a{color:#38bdf8}</style></head><body><header><h1>RES<b>Q</b>NET | HOSPITAL EMERGENCY PORTAL</h1><span id="name">Loading hospital…</span> <button onclick="logout()">Logout</button></header><main><div class="card"><h3>HOSPITAL READINESS</h3><div id="info" class="grid"></div></div><section id="alerts"></section></main><script>const token=localStorage.resqnetToken,user=JSON.parse(localStorage.resqnetUser||'null'),H={Authorization:'Bearer '+token};if(!user||user.role!=='HOSPITAL')location='/login.html';const socket=io({auth:{token}}),esc=x=>String(x??'NOT PROVIDED');async function load(){let h=await fetch('/api/hospitals/'+user.resourceId,{headers:H}).then(r=>r.json());name.textContent=h.name+' · '+h.id;info.innerHTML=`<div>Status<br><b>${esc(h.status)}</b></div><div>Trauma capability<br><b>Level ${esc(h.traumaLevel)}</b></div><div>Emergency capacity<br><b>${esc(h.emergencyCapacity)}</b></div><div>Location<br><b>${esc(h.lat)}, ${esc(h.lng)}</b></div>`;let a=await fetch('/api/incidents/alerts/pending',{headers:H}).then(r=>r.json());a.forEach(show)}function show(a){alerts.innerHTML=`<div class="card alert"><h2>🚨 INCOMING TRAUMA ALERT</h2><p><b>${a.priority}</b> · Incident ${a.incidentId}</p><div class="grid"><div>Incoming ambulance<br><b>${esc(a.incomingAmbulance)}</b></div><div>ETA<br><b>${esc(a.etaMinutes)} min</b></div><div>Accident location<br><b>${a.accidentLatitude}, ${a.accidentLongitude}</b></div><div>Patient information<br><b>${esc(a.patientCount)}</b></div><div>Help message<br>${esc(a.helpMessage)}</div><div>Acknowledgement<br><b>AWAITING RESPONSE</b></div></div><p><a target="_blank" href="${a.mapUrl}">OPEN ACCIDENT LOCATION</a></p><button class="ack" onclick="ack('${a.incidentId}')">ACKNOWLEDGE ALERT</button></div>`}async function ack(id){let r=await fetch('/api/incidents/'+id+'/hospital-ack',{method:'POST',headers:{...H,'Content-Type':'application/json'}});if(!r.ok)alert((await r.json()).error);else{alerts.innerHTML='';load()}}function logout(){localStorage.clear();location='/login.html'}socket.on('hospital:alert',show);socket.on('hospital:location:update',load);load()</script></body></html>
