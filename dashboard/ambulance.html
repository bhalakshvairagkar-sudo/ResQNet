<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResQNet Ambulance</title><link rel="stylesheet" href="/css/resqnet.css"><script src="/socket.io/socket.io.js"></script><style>body{background:#030508;color:#eaf0f7;font-family:Arial;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.card{background:#0b111e;border:1px solid #334155;border-radius:12px;padding:22px;margin-top:18px}.alert{border:2px solid #ef4444;box-shadow:0 0 26px #ef444466;animation:pulse 1.5s infinite}@keyframes pulse{50%{border-color:#fca5a5}}button,a{padding:10px 14px;border:0;border-radius:6px;font-weight:bold;margin:6px 6px 0 0}.accept{background:#22c55e}.reject{background:#ef4444;color:white}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.kv div{background:#070b14;padding:10px;border-radius:6px}</style></head><body><header><h1>RES<b>Q</b>NET | AMBULANCE OPERATIONS</h1><span id="unit">Loading unit…</span><button onclick="logout()">Logout</button></header><main><div class="card"><h3>UNIT STATUS</h3><div class="kv" id="details"></div></div><section id="alerts"></section></main><script>const token=localStorage.resqnetToken,user=JSON.parse(localStorage.resqnetUser||'null'),H={Authorization:'Bearer '+token,'Content-Type':'application/json'};if(!user||user.role!=='AMBULANCE')location='/login.html';const socket=io({auth:{token}});let unit;const esc=x=>String(x??'UNAVAILABLE');async function load(){unit=await fetch('/api/ambulances/'+user.resourceId,{headers:H}).then(r=>r.json());unitEl=unit;document.querySelector('#unit').textContent=unit.id+' · '+unit.status;details.innerHTML=`<div>Driver/unit<br><b>${esc(unit.code)}</b></div><div>Current status<br><b>${esc(unit.status)}</b></div><div>Location<br><b>${esc(unit.lat)}, ${esc(unit.lng)}</b></div><div>Current assignment<br><b>${esc(unit.currentIncidentId)}</b></div>`;let a=await fetch('/api/incidents/alerts/pending',{headers:H}).then(r=>r.json());a.forEach(show)}function show(a){alerts.innerHTML=`<div class="card alert"><h2>🚨 EMERGENCY DISPATCH</h2><p><b>${a.priority}</b> · Incident ${a.incidentId}</p><div class="kv"><div>Distance<br><b>${esc(a.distanceKm)} km</b></div><div>Response ETA<br><b>${esc(a.etaMinutes)} min</b></div><div>Accident location<br><b>${a.accidentLatitude}, ${a.accidentLongitude}</b></div><div>Help message<br>${esc(a.helpMessage)}</div></div><p><a href="${a.mapUrl}" target="_blank">OPEN ACCIDENT LOCATION</a></p><button class="accept" onclick="act('${a.incidentId}','accept')">ACCEPT DISPATCH</button><button class="reject" onclick="act('${a.incidentId}','reject')">REJECT</button></div>`}async function act(id,x){let body=x==='reject'?{reason:prompt('Rejection reason')}:{};if(x==='reject'&&!body.reason)return;let r=await fetch('/api/incidents/'+id+'/'+x,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)alert((await r.json()).error);else{alerts.innerHTML='';load()}}function logout(){localStorage.clear();location='/login.html'}socket.on('ambulance:alert',show);socket.on('ambulance:location:update',load);load()</script></body></html>
